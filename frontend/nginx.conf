server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # SPA fallback: rotas client-side caem em index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check para o Coolify/Traefik
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Cache longo para assets versionados pelo Vite (hash no nome)
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # deck.html (artefato React/Babel inline) — sem cache enquanto iteramos
    location = /deck.html {
        access_log off;
        add_header Cache-Control "no-store";
    }

    # painel-index.json: pequeno, deve estar sempre fresco para o frontend
    # detectar uma nova versão do painel.
    location = /data/painel-index.json {
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # painel.<hash>.json: hash content-addressed — 1 ano + immutable.
    # Aspas obrigatórias: nginx interpreta {n} sem aspas como bloco de código.
    location ~ "^/data/painel\.[a-f0-9]{8}\.json$" {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
    }

    # painel.json (cópia legada/fallback): sem cache.
    location = /data/painel.json {
        access_log off;
        add_header Cache-Control "no-store" always;
    }
}
