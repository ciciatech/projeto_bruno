<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Prisma Regional · Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style data-inlined-from='tokens.css'>
/* ─────────────────────────────────────────────
   PRISMA REGIONAL — Design tokens
   Sistema de cores + tipografia + espaçamento
   Base: paleta sequencial âmbar (terra) + divergente teal
   Tom: editorial-acadêmico (FT / Our World in Data)
   ───────────────────────────────────────────── */

:root {
  /* ── Neutros (warm gray) ───────────────────── */
  --bg-page:        #f7f4ee;        /* paper */
  --bg-surface:     #ffffff;
  --bg-sunken:      #f0ece4;
  --bg-overlay:     rgba(28, 22, 14, 0.04);
  --border-soft:    #e6e0d3;
  --border-strong:  #c9c0ad;
  --rule:           #1c160e;        /* hairline / divider strong */

  --ink-1:          #1c160e;        /* near-black, warm */
  --ink-2:          #3d362a;
  --ink-3:          #6b6354;
  --ink-4:          #8f8775;
  --ink-mute:       #b6ad99;

  /* ── Sequencial âmbar (5 stops) ─────────────── */
  --seq-1:          #fef3c7;
  --seq-2:          #fcd34d;
  --seq-3:          #d97706;
  --seq-4:          #92400e;
  --seq-5:          #451a03;

  /* ── Divergente (decréscimo ← 0 → crescimento) ── */
  --div-neg-3:      #134e4a;
  --div-neg-2:      #5c9c97;
  --div-neg-1:      #b8d6d3;
  --div-zero:       #f5f1e6;
  --div-pos-1:      #fcd9a8;
  --div-pos-2:      #d97706;
  --div-pos-3:      #92400e;

  /* ── Categóricos (setores) ──────────────────── */
  --cat-1: #92400e;   /* Indústria      */
  --cat-2: #1f6f6a;   /* Serviços       */
  --cat-3: #c5811f;   /* Agropecuária   */
  --cat-4: #4a5d3a;   /* Construção     */
  --cat-5: #6b3a5c;   /* Comércio       */
  --cat-6: #2a4060;   /* Adm. Pública   */

  /* ── Sinais ─────────────────────────────────── */
  --signal-good:    #1f6f6a;
  --signal-warn:    #b46414;
  --signal-bad:     #8c2a1c;
  --signal-info:    #2a4060;

  /* ── Tipografia ─────────────────────────────── */
  --font-serif:     'Source Serif 4', 'Source Serif Pro', Georgia, serif;
  --font-sans:      'Inter', -apple-system, 'Helvetica Neue', sans-serif;
  --font-mono:      'JetBrains Mono', ui-monospace, 'SF Mono', monospace;

  /* Escala (1920px) — ratio 1.2 */
  --t-display:      40px;     /* manchete de tela        */
  --t-h1:           28px;     /* título de painel        */
  --t-h2:           20px;     /* subtítulo / card        */
  --t-h3:           15px;     /* rótulo de seção         */
  --t-body:         13px;     /* corpo padrão            */
  --t-small:        12px;     /* meta, eixo              */
  --t-micro:        10.5px;   /* badge, código de fonte  */

  --lh-tight:       1.15;
  --lh-snug:        1.35;
  --lh-body:        1.55;

  /* ── Espaçamento (8pt grid) ─────────────────── */
  --s-1:  4px;
  --s-2:  8px;
  --s-3:  12px;
  --s-4:  16px;
  --s-5:  24px;
  --s-6:  32px;
  --s-7:  48px;
  --s-8:  64px;

  /* ── Outros ─────────────────────────────────── */
  --radius-sm:      2px;
  --radius-md:      4px;
  --shadow-card:    0 1px 0 rgba(28,22,14,0.04), 0 1px 3px rgba(28,22,14,0.06);
  --shadow-pop:     0 8px 28px rgba(28,22,14,0.18), 0 2px 6px rgba(28,22,14,0.08);
}

/* ── Dark mode ─────────────────────────────────── */
[data-theme="dark"] {
  --bg-page:        #14110b;
  --bg-surface:     #1c1810;
  --bg-sunken:      #0d0b07;
  --bg-overlay:     rgba(255, 248, 232, 0.04);
  --border-soft:    #2c2618;
  --border-strong:  #4a4130;
  --rule:           #f0ece4;

  --ink-1:          #f7f2e6;
  --ink-2:          #d8cfb8;
  --ink-3:          #9c9277;
  --ink-4:          #6e6650;
  --ink-mute:       #4a4332;

  --seq-1:          #3d2f10;
  --seq-2:          #92400e;
  --seq-3:          #d97706;
  --seq-4:          #fcd34d;
  --seq-5:          #fef3c7;

  --div-neg-3:      #5cc6c0;
  --div-neg-2:      #2a8a85;
  --div-neg-1:      #15403e;
  --div-zero:       #2a241a;
  --div-pos-1:      #5e3a16;
  --div-pos-2:      #d97706;
  --div-pos-3:      #fcd34d;

  --signal-good:    #5cc6c0;
  --signal-warn:    #f2a050;
  --signal-bad:     #e07565;
  --signal-info:    #7c9cc8;

  --shadow-card:    0 1px 0 rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
  --shadow-pop:     0 8px 28px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.4);
}

/* ── Reset mínimo ──────────────────────────────── */
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-page);
  color: var(--ink-1);
  font-family: var(--font-sans);
  font-size: var(--t-body);
  line-height: var(--lh-body);
  font-feature-settings: 'ss01', 'cv11';
  -webkit-font-smoothing: antialiased;
}

/* tabular numerals everywhere they matter */
.num, td.num, th.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.serif { font-family: var(--font-serif); }

</style>
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  deck-stage > section {
    width: 1920px; height: 1080px;
    background: var(--bg-page);
    color: var(--ink-1);
    font-family: var(--font-sans);
    overflow: hidden;
    position: relative;
  }
  .slide-app {
    display: grid;
    grid-template-rows: 80px auto 1fr;
    grid-template-areas: 'header' 'filters' 'main';
    height: 100%;
  }
  /* Make header/filter chrome a bit chunkier at 1920 scale */
  .slide-app header { height: 80px !important; padding: 0 36px !important; }
  /* Spec slides: pad outer */
  .spec-pad { padding: 60px 80px; height: 100%; box-sizing: border-box; overflow: hidden; }
</style>
</head>
<body>
<deck-stage width="1920" height="1080">
  <section id="cover"></section>
  <section id="paleta"></section>
  <section id="tipografia"></section>
  <section id="wireframes"></section>
  <section id="componentes"></section>
  <section id="racional"></section>
  <section id="s1"></section>
  <section id="s2"></section>
  <section id="s3"></section>
  <section id="s4"></section>
  <section id="s5"></section>
</deck-stage>

<script  data-inlined-from='deck-stage.js'>
/**
 * <deck-stage> — reusable web component for HTML decks.
 *
 * Handles:
 *  (a) speaker notes — reads <script type="application/json" id="speaker-notes">
 *      and posts {slideIndexChanged: N} to the parent window on nav.
 *  (b) keyboard navigation — ←/→, PgUp/PgDn, Space, Home/End, number keys.
 *  (c) press R to reset to slide 0 (with a tasteful keyboard hint).
 *  (d) bottom-center overlay showing slide count + hints, fades out on idle.
 *  (e) auto-scaling — inner canvas is a fixed design size (default 1920×1080)
 *      scaled with `transform: scale()` to fit the viewport, letterboxed.
 *      Set the `noscale` attribute to render at authored size (1:1) — the
 *      PPTX exporter sets this so its DOM capture sees unscaled geometry.
 *  (f) print — `@media print` lays every slide out as its own page at the
 *      design size, so the browser's Print → Save as PDF produces a clean
 *      one-page-per-slide PDF with no extra setup.
 *
 * Slides are HIDDEN, not unmounted. Non-active slides stay in the DOM with
 * `visibility: hidden` + `opacity: 0`, so their state (videos, iframes,
 * form inputs, React trees) is preserved across navigation.
 *
 * Lifecycle event — the component dispatches a `slidechange` CustomEvent on
 * itself whenever the active slide changes (including the initial mount).
 * The event bubbles and composes out of shadow DOM, so you can listen on
 * the <deck-stage> element or on document:
 *
 *   document.querySelector('deck-stage').addEventListener('slidechange', (e) => {
 *     e.detail.index         // new 0-based index
 *     e.detail.previousIndex // previous index, or -1 on init
 *     e.detail.total         // total slide count
 *     e.detail.slide         // the new active slide element
 *     e.detail.previousSlide // the prior slide element, or null on init
 *     e.detail.reason        // 'init' | 'keyboard' | 'click' | 'tap' | 'api'
 *   });
 *
 * Persistence: none at the deck level. The host app keeps the current slide
 * in its own URL (?slide=) and re-delivers it via location.hash on load, so a
 * bare load with no hash always starts at slide 1.
 *
 * Usage:
 *   <deck-stage width="1920" height="1080">
 *     <section data-label="Title">...</section>
 *     <section data-label="Agenda">...</section>
 *   </deck-stage>
 *
 * Slides are the direct element children of <deck-stage>. Each slide is
 * automatically tagged with:
 *   - data-screen-label="NN Label"   (1-indexed, for comment flow)
 *   - data-om-validate="no_overflowing_text,no_overlapping_text,slide_sized_text"
 */

(() => {
  const DESIGN_W_DEFAULT = 1920;
  const DESIGN_H_DEFAULT = 1080;
  const OVERLAY_HIDE_MS = 1800;
  const VALIDATE_ATTR = 'no_overflowing_text,no_overlapping_text,slide_sized_text';

  const pad2 = (n) => String(n).padStart(2, '0');

  const stylesheet = `
    :host {
      position: fixed;
      inset: 0;
      display: block;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas {
      position: relative;
      transform-origin: center center;
      flex-shrink: 0;
      background: #fff;
      will-change: transform;
    }

    /* Slides live in light DOM (via <slot>) so authored CSS still applies.
       We absolutely position each slotted child to stack them. */
    ::slotted(*) {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      box-sizing: border-box !important;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }
    ::slotted([data-deck-active]) {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    /* Tap zones for mobile — back/forward thirds like Stories.
       Transparent, no visible UI, don't block the overlay. */
    .tapzones {
      position: fixed;
      inset: 0;
      display: flex;
      z-index: 2147482000;
      pointer-events: none;
    }
    .tapzone {
      flex: 1;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    /* Only activate tap zones on coarse pointers (touch devices). */
    @media (hover: hover) and (pointer: fine) {
      .tapzones { display: none; }
    }

    .overlay {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 6px) scale(0.92);
      filter: blur(6px);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: #000;
      color: #fff;
      border-radius: 999px;
      font-size: 12px;
      font-feature-settings: "tnum" 1;
      letter-spacing: 0.01em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 260ms ease, transform 260ms cubic-bezier(.2,.8,.2,1), filter 260ms ease;
      transform-origin: center bottom;
      z-index: 2147483000;
      user-select: none;
    }
    .overlay[data-visible] {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0) scale(1);
      filter: blur(0);
    }

    .btn {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      border: 0;
      margin: 0;
      padding: 0;
      color: inherit;
      font: inherit;
      cursor: default;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      min-width: 28px;
      border-radius: 999px;
      color: rgba(255,255,255,0.72);
      transition: background 140ms ease, color 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .btn:active { background: rgba(255,255,255,0.18); }
    .btn:focus { outline: none; }
    .btn:focus-visible { outline: none; }
    .btn::-moz-focus-inner { border: 0; }
    .btn svg { width: 14px; height: 14px; display: block; }
    .btn.reset {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 0 10px 0 12px;
      gap: 6px;
      color: rgba(255,255,255,0.72);
    }
    .btn.reset .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      line-height: 1;
      color: rgba(255,255,255,0.88);
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
    }

    .count {
      font-variant-numeric: tabular-nums;
      color: #fff;
      font-weight: 500;
      padding: 0 8px;
      min-width: 42px;
      text-align: center;
      font-size: 12px;
    }
    .count .sep { color: rgba(255,255,255,0.45); margin: 0 3px; font-weight: 400; }
    .count .total { color: rgba(255,255,255,0.55); }

    .divider {
      width: 1px;
      height: 14px;
      background: rgba(255,255,255,0.18);
      margin: 0 2px;
    }

    /* ── Print: one page per slide, no chrome ────────────────────────────
       The screen layout stacks every slide at inset:0 inside a scaled
       canvas; for print we want them in document flow at the authored
       design size so the browser paginates one slide per sheet. The
       @page size is set from the width/height attributes via the inline
       <style id="deck-stage-print-page"> that connectedCallback injects
       into <head> (the @page at-rule has no effect inside shadow DOM). */
    @media print {
      :host {
        position: static;
        inset: auto;
        background: none;
        overflow: visible;
        color: inherit;
      }
      .stage { position: static; display: block; }
      .canvas {
        transform: none !important;
        width: auto !important;
        height: auto !important;
        background: none;
        will-change: auto;
      }
      ::slotted(*) {
        position: relative !important;
        inset: auto !important;
        width: var(--deck-design-w) !important;
        height: var(--deck-design-h) !important;
        box-sizing: border-box !important;
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto;
        break-after: page;
        page-break-after: always;
        break-inside: avoid;
        overflow: hidden;
      }
      ::slotted(*:last-child) {
        break-after: auto;
        page-break-after: auto;
      }
      .overlay, .tapzones { display: none !important; }
    }
  `;

  class DeckStage extends HTMLElement {
    static get observedAttributes() { return ['width', 'height', 'noscale']; }

    constructor() {
      super();
      this._root = this.attachShadow({ mode: 'open' });
      this._index = 0;
      this._slides = [];
      this._notes = [];
      this._hideTimer = null;
      this._mouseIdleTimer = null;

      this._onKey = this._onKey.bind(this);
      this._onResize = this._onResize.bind(this);
      this._onSlotChange = this._onSlotChange.bind(this);
      this._onMouseMove = this._onMouseMove.bind(this);
      this._onTapBack = this._onTapBack.bind(this);
      this._onTapForward = this._onTapForward.bind(this);
    }

    get designWidth() {
      return parseInt(this.getAttribute('width'), 10) || DESIGN_W_DEFAULT;
    }
    get designHeight() {
      return parseInt(this.getAttribute('height'), 10) || DESIGN_H_DEFAULT;
    }

    connectedCallback() {
      this._render();
      this._loadNotes();
      this._syncPrintPageRule();
      window.addEventListener('keydown', this._onKey);
      window.addEventListener('resize', this._onResize);
      window.addEventListener('mousemove', this._onMouseMove, { passive: true });
      // Initial collection + layout happens via slotchange, which fires on mount.
    }

    disconnectedCallback() {
      window.removeEventListener('keydown', this._onKey);
      window.removeEventListener('resize', this._onResize);
      window.removeEventListener('mousemove', this._onMouseMove);
      if (this._hideTimer) clearTimeout(this._hideTimer);
      if (this._mouseIdleTimer) clearTimeout(this._mouseIdleTimer);
    }

    attributeChangedCallback() {
      if (this._canvas) {
        this._canvas.style.width = this.designWidth + 'px';
        this._canvas.style.height = this.designHeight + 'px';
        this._canvas.style.setProperty('--deck-design-w', this.designWidth + 'px');
        this._canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');
        this._fit();
        this._syncPrintPageRule();
      }
    }

    _render() {
      const style = document.createElement('style');
      style.textContent = stylesheet;

      const stage = document.createElement('div');
      stage.className = 'stage';

      const canvas = document.createElement('div');
      canvas.className = 'canvas';
      canvas.style.width = this.designWidth + 'px';
      canvas.style.height = this.designHeight + 'px';
      canvas.style.setProperty('--deck-design-w', this.designWidth + 'px');
      canvas.style.setProperty('--deck-design-h', this.designHeight + 'px');

      const slot = document.createElement('slot');
      slot.addEventListener('slotchange', this._onSlotChange);
      canvas.appendChild(slot);
      stage.appendChild(canvas);

      // Tap zones (mobile): left third = back, right third = forward.
      const tapzones = document.createElement('div');
      tapzones.className = 'tapzones export-hidden';
      tapzones.setAttribute('aria-hidden', 'true');
      tapzones.setAttribute('data-noncommentable', '');
      const tzBack = document.createElement('div');
      tzBack.className = 'tapzone tapzone--back';
      const tzMid = document.createElement('div');
      tzMid.className = 'tapzone tapzone--mid';
      tzMid.style.pointerEvents = 'none';
      const tzFwd = document.createElement('div');
      tzFwd.className = 'tapzone tapzone--fwd';
      tzBack.addEventListener('click', this._onTapBack);
      tzFwd.addEventListener('click', this._onTapForward);
      tapzones.append(tzBack, tzMid, tzFwd);

      // Overlay: compact, solid black, with clickable controls.
      const overlay = document.createElement('div');
      overlay.className = 'overlay export-hidden';
      overlay.setAttribute('role', 'toolbar');
      overlay.setAttribute('aria-label', 'Deck controls');
      overlay.setAttribute('data-noncommentable', '');
      overlay.innerHTML = `
        <button class="btn prev" type="button" aria-label="Previous slide" title="Previous (←)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
        </button>
        <span class="count" aria-live="polite"><span class="current">1</span><span class="sep">/</span><span class="total">1</span></span>
        <button class="btn next" type="button" aria-label="Next slide" title="Next (→)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
        </button>
        <span class="divider"></span>
        <button class="btn reset" type="button" aria-label="Reset to first slide" title="Reset (R)">Reset<span class="kbd">R</span></button>
      `;

      overlay.querySelector('.prev').addEventListener('click', () => this._go(this._index - 1, 'click'));
      overlay.querySelector('.next').addEventListener('click', () => this._go(this._index + 1, 'click'));
      overlay.querySelector('.reset').addEventListener('click', () => this._go(0, 'click'));

      this._root.append(style, stage, tapzones, overlay);
      this._canvas = canvas;
      this._slot = slot;
      this._overlay = overlay;
      this._countEl = overlay.querySelector('.current');
      this._totalEl = overlay.querySelector('.total');
    }

    /** @page must live in the document stylesheet — it's a no-op inside
     *  shadow DOM. Inject/update a single <head> style tag so the print
     *  sheet matches the design size and Save-as-PDF yields one slide per
     *  page with no margins. */
    _syncPrintPageRule() {
      const id = 'deck-stage-print-page';
      let tag = document.getElementById(id);
      if (!tag) {
        tag = document.createElement('style');
        tag.id = id;
        document.head.appendChild(tag);
      }
      tag.textContent =
        '@page { size: ' + this.designWidth + 'px ' + this.designHeight + 'px; margin: 0; } ' +
        '@media print { html, body { margin: 0 !important; padding: 0 !important; background: none !important; overflow: visible !important; height: auto !important; } ' +
        '* { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }';
    }

    _onSlotChange() {
      this._collectSlides();
      this._restoreIndex();
      this._applyIndex({ showOverlay: false, broadcast: true, reason: 'init' });
      this._fit();
    }

    _collectSlides() {
      const assigned = this._slot.assignedElements({ flatten: true });
      this._slides = assigned.filter((el) => {
        // Skip template/style/script nodes even if someone slots them.
        const tag = el.tagName;
        return tag !== 'TEMPLATE' && tag !== 'SCRIPT' && tag !== 'STYLE';
      });

      this._slides.forEach((slide, i) => {
        const n = i + 1;
        // Determine a label for comment flow: prefer explicit data-label,
        // then an existing data-screen-label, then first heading, else "Slide".
        let label = slide.getAttribute('data-label');
        if (!label) {
          const existing = slide.getAttribute('data-screen-label');
          if (existing) {
            // Strip any leading number the author may have included.
            label = existing.replace(/^\s*\d+\s*/, '').trim() || existing;
          }
        }
        if (!label) {
          const h = slide.querySelector('h1, h2, h3, [data-title]');
          if (h) label = (h.textContent || '').trim().slice(0, 40);
        }
        if (!label) label = 'Slide';
        slide.setAttribute('data-screen-label', `${pad2(n)} ${label}`);

        // Validation attribute for comment flow / auto-checks.
        if (!slide.hasAttribute('data-om-validate')) {
          slide.setAttribute('data-om-validate', VALIDATE_ATTR);
        }

        slide.setAttribute('data-deck-slide', String(i));
      });

      if (this._totalEl) this._totalEl.textContent = String(this._slides.length || 1);
      if (this._index >= this._slides.length) this._index = Math.max(0, this._slides.length - 1);
    }

    _loadNotes() {
      const tag = document.getElementById('speaker-notes');
      if (!tag) { this._notes = []; return; }
      try {
        const parsed = JSON.parse(tag.textContent || '[]');
        if (Array.isArray(parsed)) this._notes = parsed;
      } catch (e) {
        console.warn('[deck-stage] Failed to parse #speaker-notes JSON:', e);
        this._notes = [];
      }
    }

    _restoreIndex() {
      // The host's ?slide= param is delivered as a #<int> hash (1-indexed) on
      // the iframe src. No hash → slide 1; the deck itself keeps no position
      // state across loads.
      const h = (location.hash || '').match(/^#(\d+)$/);
      if (h) {
        const n = parseInt(h[1], 10) - 1;
        if (n >= 0 && n < this._slides.length) this._index = n;
      }
    }

    _applyIndex({ showOverlay = true, broadcast = true, reason = 'init' } = {}) {
      if (!this._slides.length) return;
      const prev = this._prevIndex == null ? -1 : this._prevIndex;
      const curr = this._index;
      // Keep the iframe's own hash in sync so an in-iframe location.reload()
      // (reload banner path in viewer-handle.ts) lands on the current slide,
      // not the stale deep-link hash from initial load.
      try { history.replaceState(null, '', '#' + (curr + 1)); } catch (e) {}
      this._slides.forEach((s, i) => {
        if (i === curr) s.setAttribute('data-deck-active', '');
        else s.removeAttribute('data-deck-active');
      });
      if (this._countEl) this._countEl.textContent = String(curr + 1);

      if (broadcast) {
        // (1) Legacy: host-window postMessage for speaker-notes renderers.
        try { window.postMessage({ slideIndexChanged: curr }, '*'); } catch (e) {}

        // (2) In-page CustomEvent on the <deck-stage> element itself.
        //     Bubbles and composes out of shadow DOM so slide code can listen:
        //       document.querySelector('deck-stage').addEventListener('slidechange', e => {
        //         e.detail.index, e.detail.previousIndex, e.detail.total, e.detail.slide, e.detail.reason
        //       });
        const detail = {
          index: curr,
          previousIndex: prev,
          total: this._slides.length,
          slide: this._slides[curr] || null,
          previousSlide: prev >= 0 ? (this._slides[prev] || null) : null,
          reason: reason, // 'init' | 'keyboard' | 'click' | 'tap' | 'api'
        };
        this.dispatchEvent(new CustomEvent('slidechange', {
          detail,
          bubbles: true,
          composed: true,
        }));
      }

      this._prevIndex = curr;
      if (showOverlay) this._flashOverlay();
    }

    _flashOverlay() {
      if (!this._overlay) return;
      this._overlay.setAttribute('data-visible', '');
      if (this._hideTimer) clearTimeout(this._hideTimer);
      this._hideTimer = setTimeout(() => {
        this._overlay.removeAttribute('data-visible');
      }, OVERLAY_HIDE_MS);
    }

    _fit() {
      if (!this._canvas) return;
      // PPTX export sets noscale so the DOM capture sees authored-size
      // geometry — the scaled canvas is in shadow DOM, so the exporter's
      // resetTransformSelector can't reach .canvas.style.transform directly.
      if (this.hasAttribute('noscale')) {
        this._canvas.style.transform = 'none';
        return;
      }
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const s = Math.min(vw / this.designWidth, vh / this.designHeight);
      this._canvas.style.transform = `scale(${s})`;
    }

    _onResize() { this._fit(); }

    _onMouseMove() {
      // Keep overlay visible while mouse moves; hide after idle.
      this._flashOverlay();
    }

    _onTapBack(e) {
      e.preventDefault();
      this._go(this._index - 1, 'tap');
    }

    _onTapForward(e) {
      e.preventDefault();
      this._go(this._index + 1, 'tap');
    }

    _onKey(e) {
      // Ignore when the user is typing.
      const t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      const key = e.key;
      let handled = true;

      if (key === 'ArrowRight' || key === 'PageDown' || key === ' ' || key === 'Spacebar') {
        this._go(this._index + 1, 'keyboard');
      } else if (key === 'ArrowLeft' || key === 'PageUp') {
        this._go(this._index - 1, 'keyboard');
      } else if (key === 'Home') {
        this._go(0, 'keyboard');
      } else if (key === 'End') {
        this._go(this._slides.length - 1, 'keyboard');
      } else if (key === 'r' || key === 'R') {
        this._go(0, 'keyboard');
      } else if (/^[0-9]$/.test(key)) {
        // 1..9 jump to that slide; 0 jumps to 10.
        const n = key === '0' ? 9 : parseInt(key, 10) - 1;
        if (n < this._slides.length) this._go(n, 'keyboard');
      } else {
        handled = false;
      }

      if (handled) {
        e.preventDefault();
        this._flashOverlay();
      }
    }

    _go(i, reason = 'api') {
      if (!this._slides.length) return;
      const clamped = Math.max(0, Math.min(this._slides.length - 1, i));
      if (clamped === this._index) {
        this._flashOverlay();
        return;
      }
      this._index = clamped;
      this._applyIndex({ showOverlay: true, broadcast: true, reason });
    }

    // Public API ------------------------------------------------------------

    /** Current slide index (0-based). */
    get index() { return this._index; }
    /** Total slide count. */
    get length() { return this._slides.length; }
    /** Programmatically navigate. */
    goTo(i) { this._go(i, 'api'); }
    next() { this._go(this._index + 1, 'api'); }
    prev() { this._go(this._index - 1, 'api'); }
    reset() { this._go(0, 'api'); }
  }

  if (!customElements.get('deck-stage')) {
    customElements.define('deck-stage', DeckStage);
  }
})();

</script>

<script type="text/babel" data-inlined-from='charts.jsx'>
/* Chart primitives — Prisma Regional
   ---------------------------------------------------
   Editorial-grade charts: sparse axes, no chart-junk,
   Tufte-ish data-ink. SVG only, no deps.
   --------------------------------------------------- */

const fmtBRL = (v) => {
  if (Math.abs(v) >= 1e9) return 'R$ ' + (v / 1e9).toFixed(1).replace('.', ',') + ' bi';
  if (Math.abs(v) >= 1e6) return 'R$ ' + (v / 1e6).toFixed(0) + ' mi';
  if (Math.abs(v) >= 1e3) return 'R$ ' + (v / 1e3).toFixed(0) + ' mil';
  return 'R$ ' + v.toFixed(0);
};
const fmtNum = (v) => v.toLocaleString('pt-BR');
const fmtPct = (v, d = 1) => (v >= 0 ? '+' : '') + v.toFixed(d).replace('.', ',') + '%';
const fmtCompact = (v) => {
  if (Math.abs(v) >= 1e9) return (v / 1e9).toFixed(1).replace('.', ',') + ' bi';
  if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(0) + ' mi';
  if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(0) + 'k';
  return v.toFixed(0);
};

/* ── ChoroplethBR ────────────────────────────────
   Mapa simbólico estilizado dos 27 UFs (não geograficamente preciso,
   mas reconhecível e suficiente para hi-fi mockup). Cada UF é um
   tile arranjado em layout que aproxima a forma do Brasil.
   Para produção, trocar por TopoJSON real. */

const UF_LAYOUT = [
  // [code, col, row, fullName, region]
  ['RR', 2, 0, 'Roraima',         'N'],
  ['AP', 4, 0, 'Amapá',           'N'],
  ['AM', 1, 1, 'Amazonas',        'N'],
  ['PA', 3, 1, 'Pará',            'N'],
  ['MA', 4, 1, 'Maranhão',        'NE'],
  ['CE', 5, 1, 'Ceará',           'NE'],
  ['RN', 6, 1, 'Rio Grande do Norte', 'NE'],
  ['AC', 0, 2, 'Acre',            'N'],
  ['RO', 1, 2, 'Rondônia',        'N'],
  ['TO', 3, 2, 'Tocantins',       'N'],
  ['PI', 4, 2, 'Piauí',           'NE'],
  ['PB', 6, 2, 'Paraíba',         'NE'],
  ['PE', 5, 2, 'Pernambuco',      'NE'],
  ['AL', 6, 3, 'Alagoas',         'NE'],
  ['SE', 5, 3, 'Sergipe',         'NE'],
  ['BA', 4, 3, 'Bahia',           'NE'],
  ['MT', 2, 3, 'Mato Grosso',     'CO'],
  ['DF', 3, 3, 'Distrito Federal','CO'],
  ['GO', 3, 4, 'Goiás',           'CO'],
  ['MS', 2, 4, 'Mato Grosso do Sul','CO'],
  ['MG', 4, 4, 'Minas Gerais',    'SE'],
  ['ES', 5, 4, 'Espírito Santo',  'SE'],
  ['SP', 3, 5, 'São Paulo',       'SE'],
  ['RJ', 4, 5, 'Rio de Janeiro',  'SE'],
  ['PR', 3, 6, 'Paraná',          'S'],
  ['SC', 3, 7, 'Santa Catarina',  'S'],
  ['RS', 2, 8, 'Rio Grande do Sul','S'],
];

function ChoroplethBR({ values, scale = 'seq', width = 520, height = 620, onHover, selected, tile = 56, gap = 4, showLabels = true }) {
  // values: { UF: number }
  const vs = Object.values(values).filter((v) => v != null);
  const min = Math.min(...vs), max = Math.max(...vs);
  const range = max - min || 1;
  const buckets = scale === 'seq'
    ? ['var(--seq-1)','var(--seq-2)','var(--seq-3)','var(--seq-4)','var(--seq-5)']
    : ['var(--div-neg-3)','var(--div-neg-2)','var(--div-neg-1)','var(--div-zero)','var(--div-pos-1)','var(--div-pos-2)','var(--div-pos-3)'];

  const colorOf = (v) => {
    if (v == null) return 'var(--bg-sunken)';
    if (scale === 'div') {
      // -10 .. +10 mapped to 7 buckets centered at 0
      const t = Math.max(-1, Math.min(1, v / 10));
      const i = Math.round((t + 1) * 3);
      return buckets[i];
    }
    const t = (v - min) / range;
    return buckets[Math.min(buckets.length - 1, Math.floor(t * buckets.length))];
  };

  const cols = 7, rows = 9;
  const W = cols * (tile + gap);
  const H = rows * (tile + gap);

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width={width} height={height} style={{ display: 'block' }}>
      {UF_LAYOUT.map(([uf, c, r, name, region]) => {
        const x = c * (tile + gap);
        const y = r * (tile + gap);
        const v = values[uf];
        const fill = colorOf(v);
        const isSel = selected === uf;
        return (
          <g key={uf}
             onMouseEnter={onHover ? (e) => onHover({ uf, name, region, value: v, x: e.clientX, y: e.clientY }) : undefined}
             onMouseLeave={onHover ? () => onHover(null) : undefined}
             style={{ cursor: 'pointer' }}>
            <rect x={x} y={y} width={tile} height={tile} fill={fill}
                  stroke={isSel ? 'var(--rule)' : 'var(--bg-page)'}
                  strokeWidth={isSel ? 2 : 1}
                  rx="1" />
            {showLabels && (
              <>
                <text x={x + tile / 2} y={y + tile / 2 - 2}
                      textAnchor="middle" dominantBaseline="middle"
                      style={{
                        fontFamily: 'var(--font-sans)',
                        fontSize: 11, fontWeight: 600,
                        fill: (scale === 'seq' && v > min + range * 0.55) ? 'var(--bg-page)' : 'var(--ink-1)',
                        pointerEvents: 'none',
                      }}>{uf}</text>
                {v != null && (
                  <text x={x + tile / 2} y={y + tile / 2 + 11}
                        textAnchor="middle" dominantBaseline="middle"
                        style={{
                          fontFamily: 'var(--font-mono)',
                          fontSize: 9, fontVariantNumeric: 'tabular-nums',
                          fill: (scale === 'seq' && v > min + range * 0.55) ? 'var(--bg-page)' : 'var(--ink-2)',
                          pointerEvents: 'none',
                          opacity: 0.85,
                        }}>{scale === 'div' ? fmtPct(v, 1) : fmtCompact(v)}</text>
                )}
              </>
            )}
          </g>
        );
      })}
    </svg>
  );
}

/* ── Legenda de mapa (gradiente discreto) ─────── */
function MapLegend({ scale = 'seq', min, max, label, format = fmtCompact }) {
  const buckets = scale === 'seq'
    ? ['var(--seq-1)','var(--seq-2)','var(--seq-3)','var(--seq-4)','var(--seq-5)']
    : ['var(--div-neg-3)','var(--div-neg-2)','var(--div-neg-1)','var(--div-zero)','var(--div-pos-1)','var(--div-pos-2)','var(--div-pos-3)'];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div style={{ fontSize: 11, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: 0.6, fontWeight: 600 }}>{label}</div>
      <div style={{ display: 'flex', gap: 0 }}>
        {buckets.map((c, i) => (
          <div key={i} style={{ width: 28, height: 12, background: c, borderTop: '1px solid var(--border-soft)', borderBottom: '1px solid var(--border-soft)',
            ...(i === 0 ? { borderLeft: '1px solid var(--border-soft)' } : {}),
            ...(i === buckets.length - 1 ? { borderRight: '1px solid var(--border-soft)' } : {})
          }} />
        ))}
      </div>
      <div className="mono" style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: 'var(--ink-2)', width: buckets.length * 28 }}>
        <span>{scale === 'div' ? '−10%' : format(min)}</span>
        <span>{scale === 'div' ? '0' : ''}</span>
        <span>{scale === 'div' ? '+10%' : format(max)}</span>
      </div>
    </div>
  );
}

/* ── Linhas (séries temporais) ────────────────── */
function LineChart({ series, width = 720, height = 260, padding = { t: 20, r: 24, b: 32, l: 56 }, yLabel, xTicks, yFormat = fmtCompact, highlight, dashed }) {
  // series: [{ name, color, points: [{x, y}] }]
  const all = series.flatMap((s) => s.points);
  const xs = all.map((p) => p.x), ys = all.map((p) => p.y);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(0, Math.min(...ys));
  const yMax = Math.max(...ys) * 1.05;

  const W = width - padding.l - padding.r;
  const H = height - padding.t - padding.b;
  const sx = (x) => padding.l + ((x - xMin) / (xMax - xMin || 1)) * W;
  const sy = (y) => padding.t + (1 - (y - yMin) / (yMax - yMin || 1)) * H;

  const yTicks = 4;
  const yStep = (yMax - yMin) / yTicks;

  return (
    <svg width={width} height={height} style={{ display: 'block', overflow: 'visible' }}>
      {/* gridlines horizontais */}
      {Array.from({ length: yTicks + 1 }).map((_, i) => {
        const y = sy(yMin + i * yStep);
        return (
          <g key={i}>
            <line x1={padding.l} x2={width - padding.r} y1={y} y2={y}
                  stroke="var(--border-soft)" strokeWidth="0.75" />
            <text x={padding.l - 8} y={y + 3} textAnchor="end"
                  style={{ fontFamily: 'var(--font-mono)', fontSize: 11, fill: 'var(--ink-3)', fontVariantNumeric: 'tabular-nums' }}>
              {yFormat(yMin + i * yStep)}
            </text>
          </g>
        );
      })}
      {/* eixo x ticks */}
      {(xTicks || []).map((t, i) => {
        const xv = typeof t === 'object' ? t.x : t;
        const lbl = typeof t === 'object' ? t.label : t;
        return (
          <text key={i} x={sx(xv)} y={height - padding.b + 16} textAnchor="middle"
                style={{ fontFamily: 'var(--font-mono)', fontSize: 11, fill: 'var(--ink-3)' }}>{lbl}</text>
        );
      })}
      {/* baseline */}
      <line x1={padding.l} x2={width - padding.r} y1={sy(0)} y2={sy(0)} stroke="var(--rule)" strokeWidth="1" />
      {/* series */}
      {series.map((s, i) => {
        const d = s.points.map((p, j) => `${j ? 'L' : 'M'}${sx(p.x)},${sy(p.y)}`).join(' ');
        return (
          <g key={i}>
            <path d={d} fill="none" stroke={s.color || 'var(--ink-1)'}
                  strokeWidth={s.weight || (highlight && highlight === s.name ? 2.5 : 1.5)}
                  strokeLinejoin="round" strokeLinecap="round"
                  strokeDasharray={(dashed && dashed.includes(s.name)) ? '4 3' : undefined}
                  opacity={highlight && highlight !== s.name ? 0.35 : 1}/>
            {/* end label */}
            {s.points.length > 0 && (
              <text x={sx(s.points[s.points.length - 1].x) + 5}
                    y={sy(s.points[s.points.length - 1].y) + 3}
                    style={{ fontFamily: 'var(--font-sans)', fontSize: 11, fill: s.color || 'var(--ink-1)', fontWeight: 600 }}>
                {s.name}
              </text>
            )}
          </g>
        );
      })}
      {yLabel && (
        <text x={padding.l - 44} y={padding.t - 6}
              style={{ fontFamily: 'var(--font-sans)', fontSize: 10.5, fill: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: 0.6, fontWeight: 600 }}>{yLabel}</text>
      )}
    </svg>
  );
}

/* ── Barras horizontais ─────────────────────── */
function HBar({ data, width = 380, height = 220, valueFormat = fmtCompact, color = 'var(--seq-3)', maxBars = 10 }) {
  const items = data.slice(0, maxBars);
  const max = Math.max(...items.map((d) => Math.abs(d.value)));
  const labelW = 86;
  const barW = width - labelW - 70;
  const rowH = (height - 8) / items.length;

  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      {items.map((d, i) => {
        const w = (Math.abs(d.value) / max) * barW;
        const y = i * rowH + 4;
        const isNeg = d.value < 0;
        const fill = d.color || (isNeg ? 'var(--div-neg-2)' : color);
        return (
          <g key={d.label}>
            <text x={labelW - 8} y={y + rowH / 2 + 3} textAnchor="end"
                  style={{ fontFamily: 'var(--font-sans)', fontSize: 12, fill: 'var(--ink-2)' }}>
              {d.label}
            </text>
            <rect x={labelW} y={y + 4} width={w} height={rowH - 8} fill={fill} />
            <text x={labelW + w + 6} y={y + rowH / 2 + 3}
                  style={{ fontFamily: 'var(--font-mono)', fontSize: 11, fill: 'var(--ink-1)', fontVariantNumeric: 'tabular-nums', fontWeight: 600 }}>
              {valueFormat(d.value)}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

/* ── Stacked bars (composição) ───────────────── */
function StackedBars({ data, keys, colors, width = 720, height = 240, padding = { t: 16, r: 12, b: 36, l: 56 } }) {
  // data: [{ x: 'label', a: 10, b: 20 }, ...]
  const W = width - padding.l - padding.r;
  const H = height - padding.t - padding.b;
  const max = Math.max(...data.map((d) => keys.reduce((s, k) => s + d[k], 0)));
  const bw = W / data.length * 0.7;
  const sx = (i) => padding.l + (i + 0.5) * (W / data.length) - bw / 2;
  const sy = (v) => padding.t + (1 - v / max) * H;

  return (
    <svg width={width} height={height} style={{ display: 'block', overflow: 'visible' }}>
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => {
        const y = padding.t + (1 - t) * H;
        return (
          <g key={i}>
            <line x1={padding.l} x2={width - padding.r} y1={y} y2={y} stroke="var(--border-soft)" strokeWidth="0.75" />
            <text x={padding.l - 8} y={y + 3} textAnchor="end"
                  style={{ fontFamily: 'var(--font-mono)', fontSize: 11, fill: 'var(--ink-3)', fontVariantNumeric: 'tabular-nums' }}>
              {fmtCompact(t * max)}
            </text>
          </g>
        );
      })}
      {data.map((d, i) => {
        let acc = 0;
        return (
          <g key={i}>
            {keys.map((k, j) => {
              const v = d[k];
              const y0 = sy(acc + v), y1 = sy(acc);
              acc += v;
              return <rect key={k} x={sx(i)} width={bw} y={y0} height={y1 - y0} fill={colors[j]} />;
            })}
            <text x={sx(i) + bw / 2} y={height - padding.b + 14} textAnchor="middle"
                  style={{ fontFamily: 'var(--font-mono)', fontSize: 11, fill: 'var(--ink-3)' }}>{d.x}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ── Scatter + linha de regressão ─────────────── */
function ScatterRegression({ points, width = 720, height = 420, padding = { t: 28, r: 28, b: 48, l: 64 }, xLabel, yLabel, xFormat = fmtCompact, yFormat = (v) => v.toFixed(1), highlight, regression }) {
  // points: [{ x, y, label, region, size? }]
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const padX = (xMax - xMin) * 0.05, padY = (yMax - yMin) * 0.08;
  const xLo = xMin - padX, xHi = xMax + padX;
  const yLo = yMin - padY, yHi = yMax + padY;

  const W = width - padding.l - padding.r;
  const H = height - padding.t - padding.b;
  const sx = (x) => padding.l + ((x - xLo) / (xHi - xLo)) * W;
  const sy = (y) => padding.t + (1 - (y - yLo) / (yHi - yLo)) * H;

  const regionColor = {
    N:  'var(--cat-3)',
    NE: 'var(--cat-1)',
    CO: 'var(--cat-4)',
    SE: 'var(--cat-2)',
    S:  'var(--cat-5)',
  };

  return (
    <svg width={width} height={height} style={{ display: 'block', overflow: 'visible' }}>
      {/* grid */}
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => {
        const x = padding.l + t * W;
        const y = padding.t + (1 - t) * H;
        return (
          <g key={i}>
            <line x1={padding.l} x2={width - padding.r} y1={y} y2={y} stroke="var(--border-soft)" strokeWidth="0.5" />
            <line y1={padding.t} y2={height - padding.b} x1={x} x2={x} stroke="var(--border-soft)" strokeWidth="0.5" />
            <text x={x} y={height - padding.b + 16} textAnchor="middle" style={{ fontFamily: 'var(--font-mono)', fontSize: 11, fill: 'var(--ink-3)' }}>
              {xFormat(xLo + t * (xHi - xLo))}
            </text>
            <text x={padding.l - 8} y={y + 3} textAnchor="end" style={{ fontFamily: 'var(--font-mono)', fontSize: 11, fill: 'var(--ink-3)' }}>
              {yFormat(yLo + t * (yHi - yLo))}
            </text>
          </g>
        );
      })}
      {/* axis labels */}
      <text x={padding.l + W / 2} y={height - 6} textAnchor="middle"
            style={{ fontFamily: 'var(--font-sans)', fontSize: 11, fill: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: 0.6, fontWeight: 600 }}>{xLabel}</text>
      <text transform={`rotate(-90 ${14} ${padding.t + H / 2})`} x={14} y={padding.t + H / 2} textAnchor="middle"
            style={{ fontFamily: 'var(--font-sans)', fontSize: 11, fill: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: 0.6, fontWeight: 600 }}>{yLabel}</text>

      {/* regression line */}
      {regression && (
        <>
          <line x1={sx(xLo)} y1={sy(regression.intercept + regression.slope * xLo)}
                x2={sx(xHi)} y2={sy(regression.intercept + regression.slope * xHi)}
                stroke="var(--ink-1)" strokeWidth="1.5" strokeDasharray="6 3" />
          {regression.ci && (
            <path d={`M${sx(xLo)},${sy(regression.intercept + regression.slope * xLo - regression.ci)}
                       L${sx(xHi)},${sy(regression.intercept + regression.slope * xHi - regression.ci)}
                       L${sx(xHi)},${sy(regression.intercept + regression.slope * xHi + regression.ci)}
                       L${sx(xLo)},${sy(regression.intercept + regression.slope * xLo + regression.ci)} Z`}
                  fill="var(--ink-1)" opacity="0.06" />
          )}
        </>
      )}

      {/* points */}
      {points.map((p, i) => {
        const r = p.size ? Math.sqrt(p.size) * 1.2 + 3 : 4;
        const sel = highlight && highlight === p.label;
        return (
          <g key={i}>
            <circle cx={sx(p.x)} cy={sy(p.y)} r={r}
                    fill={regionColor[p.region] || 'var(--ink-3)'}
                    stroke={sel ? 'var(--rule)' : 'var(--bg-surface)'}
                    strokeWidth={sel ? 1.8 : 1}
                    fillOpacity={sel ? 1 : 0.78} />
            {(sel || (p.size && p.size > 50)) && (
              <text x={sx(p.x) + r + 4} y={sy(p.y) + 3}
                    style={{ fontFamily: 'var(--font-sans)', fontSize: 11, fill: 'var(--ink-1)', fontWeight: 600 }}>{p.label}</text>
            )}
          </g>
        );
      })}
    </svg>
  );
}

/* ── Sparkline (inline, sem eixos) ─────────────── */
function Sparkline({ data, width = 80, height = 22, color = 'var(--seq-3)', showDot = true }) {
  if (!data || !data.length) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const sx = (i) => (i / (data.length - 1)) * width;
  const sy = (v) => height - ((v - min) / range) * (height - 4) - 2;
  const d = data.map((v, i) => `${i ? 'L' : 'M'}${sx(i)},${sy(v)}`).join(' ');
  return (
    <svg width={width} height={height} style={{ display: 'inline-block', verticalAlign: 'middle' }}>
      <path d={d} fill="none" stroke={color} strokeWidth="1.2" strokeLinejoin="round" />
      {showDot && <circle cx={sx(data.length - 1)} cy={sy(data[data.length - 1])} r="2" fill={color} />}
    </svg>
  );
}

/* ── Bullet (KPI compacto com referência) ────── */
function Bullet({ value, target, range = [0, 100], width = 140, height = 22, format = fmtCompact, color = 'var(--seq-3)' }) {
  const [lo, hi] = range;
  const sx = (v) => ((v - lo) / (hi - lo)) * (width - 2) + 1;
  return (
    <svg width={width} height={height}>
      <rect x="0" y="6" width={width} height={height - 12} fill="var(--bg-sunken)" />
      <rect x="0" y="6" width={sx(value)} height={height - 12} fill={color} />
      <line x1={sx(target)} x2={sx(target)} y1="2" y2={height - 2} stroke="var(--rule)" strokeWidth="1.5" />
    </svg>
  );
}

Object.assign(window, {
  fmtBRL, fmtNum, fmtPct, fmtCompact,
  ChoroplethBR, MapLegend,
  LineChart, HBar, StackedBars, ScatterRegression, Sparkline, Bullet,
  UF_LAYOUT,
});

                         fontSize: 11, color: 'var(--ink-3)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          {footer}
        </footer>
      )}
    </section>
  );
}

function PanelAction({ children }) {
  return (
    <div style={{ display: 'flex', gap: 4 }}>
      {React.Children.map(children, (c, i) => (
        <button key={i} style={{ ...btn(), padding: '3px 8px', fontSize: 11 }}>{c}</button>
      ))}
    </div>
  );
}

function KPI({ label, value, unit, delta, sparkData, sparkColor, sub }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4, padding: '8px 0' }}>
      <div style={{ fontSize: 10.5, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: 0.8, fontWeight: 600 }}>{label}</div>

          {value}

        {unit && <span className="mono" style={{ fontSize: 12, color: 'var(--ink-3)' }}>{unit}</span>}
        {delta != null && (
          <span className="mono" style={{
            fontSize: 12,
            color: delta >= 0 ? 'var(--signal-good)' : 'var(--signal-bad)',
            fontWeight: 600,
          }}>
            {delta >= 0 ? '▲' : '▼'} {fmtPct(delta)}
          </span>
        )}

      {sparkData && (
        <div style={{ marginTop: 2 }}>
          <Sparkline data={sparkData} color={sparkColor || 'var(--seq-3)'} width={120} height={20} />
        </div>
      )}
      {sub && <div style={{ fontSize: 11, color: 'var(--ink-3)' }}>{sub}</div>}
    </div>
  );
}

function Tag({ children, tone = 'neutral' }) {
  const tones = {
    neutral: { bg: 'var(--bg-sunken)', fg: 'var(--ink-2)' },
    good:    { bg: 'rgba(31,111,106,0.12)', fg: 'var(--signal-good)' },
    warn:    { bg: 'rgba(180,100,20,0.12)', fg: 'var(--signal-warn)' },
    bad:     { bg: 'rgba(140,42,28,0.12)', fg: 'var(--signal-bad)' },
    info:    { bg: 'rgba(42,64,96,0.10)', fg: 'var(--signal-info)' },
  };
  const t = tones[tone];
  return (
    <span className="mono" style={{
      background: t.bg, color: t.fg,
      fontSize: 10.5, fontWeight: 600,
      padding: '2px 6px',
      borderRadius: 'var(--radius-sm)',
      textTransform: 'uppercase', letterSpacing: 0.5,
    }}>{children}</span>
  );
}

function Tooltip({ data }) {
  if (!data) return null;
  return (
    <div style={{
      position: 'fixed',
      left: data.x + 14, top: data.y + 14,
      background: 'var(--bg-surface)',
      border: '1px solid var(--border-strong)',
      boxShadow: 'var(--shadow-pop)',
      padding: '10px 12px',
      pointerEvents: 'none',
      minWidth: 200,
      zIndex: 100,
    }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 8, marginBottom: 4 }}>
        <span className="serif" style={{ fontSize: 14, fontWeight: 600, color: 'var(--ink-1)' }}>{data.name}</span>
        <span className="mono" style={{ fontSize: 10, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: 0.6 }}>{data.uf} · {data.region}</span>
      </div>
      {data.children}
      {data.value != null && !data.children && (
        <>
          <div className="mono" style={{ fontSize: 18, fontWeight: 600, color: 'var(--ink-1)' }}>
            {fmtBRL(data.value * 1e6)}
          </div>
          <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 4 }}>investimento anunciado · 2024</div>
        </>
      )}
    </div>
  );
}

/* Tabela densa para "leitura de tabelas grandes" */
function DenseTable({ columns, rows, sortKey, onSort, footer }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', minHeight: 0 }}>
      <div style={{ overflow: 'auto', flex: 1 }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
          <thead>
            <tr style={{ position: 'sticky', top: 0, background: 'var(--bg-surface)', zIndex: 1 }}>
              {columns.map((c, i) => (
                <th key={i} onClick={() => onSort && onSort(c.key)}
                  style={{
                    textAlign: c.align || 'left',
                    padding: '6px 10px',
                    fontSize: 10, fontWeight: 600, color: 'var(--ink-3)',
                    textTransform: 'uppercase', letterSpacing: 0.6,
                    borderBottom: '1px solid var(--rule)',
                    cursor: onSort ? 'pointer' : 'default',
                    whiteSpace: 'nowrap',
                  }}>
                  {c.label}
                  {sortKey === c.key && <span style={{ marginLeft: 4 }}>↓</span>}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i} style={{ borderBottom: '1px solid var(--border-soft)' }}>
                {columns.map((c, j) => (
                  <td key={j} className={c.mono ? 'mono' : ''}
                    style={{
                      padding: '6px 10px',
                      textAlign: c.align || 'left',
                      color: c.muted ? 'var(--ink-3)' : 'var(--ink-1)',
                      fontVariantNumeric: c.mono ? 'tabular-nums' : 'normal',
                      whiteSpace: 'nowrap',
                    }}>
                    {c.render ? c.render(r) : r[c.key]}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {footer && (
        <div style={{ padding: '6px 10px', fontSize: 11, color: 'var(--ink-3)', borderTop: '1px solid var(--border-soft)', display: 'flex', justifyContent: 'space-between' }}>
          {footer}
        </div>
      )}
    </div>
  );
}

/* Anotação editorial — citação ou nota de rodapé inline */
function EditorialNote({ children }) {
  return (
    <div style={{
      borderLeft: '2px solid var(--seq-3)',
      paddingLeft: 10,
      fontSize: 12,
      color: 'var(--ink-2)',
      lineHeight: 1.5,
      fontStyle: 'italic',
      fontFamily: 'var(--font-serif)',
    }}>{children}</div>
  );
}

Object.assign(window, { AppHeader, FilterBar, Panel, PanelAction, KPI, Tag, Tooltip, DenseTable, EditorialNote, btn });

</script>

function SpecJustificativa() {
  const Q = ({ q, a }) => (
    <div style={{ marginBottom: 22, paddingBottom: 22, borderBottom: '1px solid var(--border-soft)' }}>
      <div className="mono" style={{ fontSize: 10, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: 0.8, fontWeight: 600, marginBottom: 6 }}>decisão</div>
      <h3 className="serif" style={{ fontSize: 17, fontWeight: 600, margin: '0 0 8px', letterSpacing: -0.2 }}>{q}</h3>
      <p style={{ margin: 0, fontSize: 13, color: 'var(--ink-2)', lineHeight: 1.6 }}>{a}</p>
    </div>
  );
  return (
    <div style={{ padding: 24, background: 'var(--bg-page)', height: '100%', overflow: 'auto' }}>
      <div className="mono" style={{ fontSize: 10, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: 0.8, fontWeight: 600 }}>00 · Racional</div>
      <h1 className="serif" style={{ margin: '4px 0 24px', fontSize: 28, fontWeight: 600, letterSpacing: -0.5 }}>Justificativa de design</h1>

      <Q q="Por que mapas em tile-grid e não geográficos?"
         a="Para um overview comparativo de 27 UFs, a geografia real distorce a leitura — RR ocupa mais pixels que SP mas pesa muito menos no fenômeno. Tile-grid dá área igual a cada UF e força comparação por intensidade, não por tamanho. A forma macroregional (N/NE/CO/SE/S) é preservada o suficiente para o reconhecimento. Para drill municipal, plano é trocar por TopoJSON real com simplificação por escala." />

      <Q q="Por que serifa em manchetes em um produto técnico?"
         a="O brief pede 'acadêmico sério mas moderno' e 'não corporate dashboard genérico'. Serifa em manchetes (Source Serif 4) traz o registro de papers/jornalismo de dados (FT, OWiD) sem ficar nostálgico. UI e dados densos seguem em sans (Inter) — combinação clássica de editorial digital." />

      <Q q="Por que numerais sempre em mono?"
         a="Tabular-nums em todos os números (R$ 142.847.300, +12,4%, p=0,0028) garante alinhamento decimal vertical em tabelas e horizontal em KPIs sequenciais. Em pesquisa econômica isso é não-negociável: ler 5 R$/UF empilhados é trivial em mono e impossível em proporcional. Custo: estética ligeiramente mais 'técnica' — exatamente o tom desejado." />

      <Q q="Por que filter bar superior em vez de sidebar?"
         a="Mapas são protagonistas. Sidebar de 240-280px rouba ~15% da largura. Top bar perde uma faixa de 56px de altura — em telas largas (1440+), trade-off claramente favorável ao mapa. Filtros raramente passam de 5 dimensões; quando precisar de mais, painel '+ adicionar filtro' abre overlay sem ocupar espaço permanente." />

      <Q q="Por que paleta âmbar/terra em vez de azul?"
         a="Azul é o default de SaaS analytics — exatamente o que o brief pede para evitar. Âmbar/terra evoca cartografia histórica, papel envelhecido, sépia editorial. Mantém legibilidade quantitativa (ordem clara light→dark) sem importar o vocabulário visual de PowerBI/Tableau. Acentos em laranja queimado (#d97706) destacam o que importa." />

      <Q q="Por que dark mode é necessário (não opcional)?"
         a="Brief explicita 'sessões longas de análise'. Tela clara após 2-3h causa fadiga e altera percepção de cor (drift do cinza). Dark mode com fundo levemente brunido (#14110b, não preto puro) e tons sequenciais invertidos preserva a hierarquia da escala. Toggle persistente no header." />

      <Q q="Por que mostrar regressão e não só correlação?"
         a="Tela 4 é onde o trabalho deixa de ser descritivo e vira inferência. Mostrar β, erro-padrão, R², p-valor e n no mesmo painel deixa o leitor decidir confiança. Anotações editoriais (em serifa itálica) avisam contra over-interpretação — o produto ensina o leitor a usar os dados criticamente, em vez de só apresentá-los." />

      <Q q="O que NÃO foi feito (escopo desta entrega)">
         <span /></Q>
      <ul style={{ fontSize: 12.5, color: 'var(--ink-2)', lineHeight: 1.65, paddingLeft: 18 }}>
        <li>Mapas reais com TopoJSON (município/mesorregião) — usei tile-grid simbólico</li>
        <li>Interatividade real: brushing/linking entre painéis, drill UF→meso→município</li>
        <li>Exportação real (SVG/PNG/CSV); botões existem mas não atuam</li>

    </div>
