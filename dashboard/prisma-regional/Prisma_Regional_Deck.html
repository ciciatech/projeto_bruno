<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Prisma Regional · Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { height: 100%; margin: 0; background: #000; }
  deck-stage > section {
    width: 1920px; height: 1080px;
    background: var(--bg-page);
    color: var(--ink-1);
    font-family: var(--font-sans);
    overflow: hidden;
    position: relative;
  }
  .slide-app {
    display: grid;
    grid-template-rows: 80px auto 1fr;
    grid-template-areas: 'header' 'filters' 'main';
    height: 100%;
  }
  /* Make header/filter chrome a bit chunkier at 1920 scale */
  .slide-app header { height: 80px !important; padding: 0 36px !important; }
  /* Spec slides: pad outer */
  .spec-pad { padding: 60px 80px; height: 100%; box-sizing: border-box; overflow: hidden; }
</style>
</head>
<body>
<deck-stage width="1920" height="1080">
  <section id="cover"></section>
  <section id="paleta"></section>
  <section id="tipografia"></section>
  <section id="wireframes"></section>
  <section id="componentes"></section>
  <section id="racional"></section>
  <section id="s1"></section>
  <section id="s2"></section>
  <section id="s3"></section>
  <section id="s4"></section>
  <section id="s5"></section>
</deck-stage>

<script src="deck-stage.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="charts.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="screen01.jsx"></script>
<script type="text/babel" src="screen02.jsx"></script>
<script type="text/babel" src="screen03.jsx"></script>
<script type="text/babel" src="screen04.jsx"></script>
<script type="text/babel" src="screen05.jsx"></script>
<script type="text/babel" src="spec.jsx"></script>

<script type="text/babel">
function Cover() {
  return (
    <div style={{ padding: 96, height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', boxSizing: 'border-box', background: 'var(--bg-page)' }}>
      <div className="mono" style={{ fontSize: 18, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: 1.6, fontWeight: 600 }}>
        IPEA · Plataforma de análise regional · v0.4 · abr 2026
      </div>

      <div>
        <div className="serif" style={{ fontSize: 168, fontWeight: 700, lineHeight: 0.95, letterSpacing: -4, color: 'var(--ink-1)' }}>
          Prisma<span style={{ color: 'var(--seq-3)' }}>·</span>Regional
        </div>
        <div className="serif" style={{ fontSize: 38, fontWeight: 400, marginTop: 28, color: 'var(--ink-2)', lineHeight: 1.3, maxWidth: 1200, fontStyle: 'italic' }}>
          Investimento, emprego e estrutura produtiva das 27 unidades federativas brasileiras — em alta densidade, com rigor acadêmico.
        </div>
      </div>

      <div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 48, marginBottom: 48, fontSize: 22, color: 'var(--ink-2)', lineHeight: 1.55, maxWidth: 1400 }}>
          <div>
            <div className="mono" style={{ fontSize: 16, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: 1, fontWeight: 600, marginBottom: 10 }}>Telas</div>
            <ol style={{ margin: 0, paddingLeft: 32 }}>
              <li>Investimento por UF</li>
              <li>Dinâmica do emprego formal</li>
              <li>Composição setorial regional</li>
              <li>Relação causal investimento → emprego</li>
              <li>Pipeline e qualidade de dados</li>
            </ol>
          </div>
          <div>
            <div className="mono" style={{ fontSize: 16, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: 1, fontWeight: 600, marginBottom: 10 }}>Princípios</div>
            <ul style={{ margin: 0, paddingLeft: 32 }}>
              <li>Mapas como protagonistas</li>
              <li>Densidade alta com hierarquia</li>
              <li>Numerais em mono · acentuação BR</li>
              <li>Dark mode primeiro-cidadão</li>
              <li>Tom editorial, não corporativo</li>
            </ul>
          </div>
        </div>
        <div style={{ borderTop: '1px solid var(--rule)', paddingTop: 24, fontSize: 18, color: 'var(--ink-3)', display: 'flex', justifyContent: 'space-between' }}>
          <span className="mono">Inspiração: FT · Our World in Data · Observable Plot · The Economist</span>
          <span className="mono">5 telas · 12 componentes · 2 modos</span>
        </div>
      </div>
    </div>
  );
}

function ScreenSlide({ n, ScreenComp }) {
  const filters = { periodo: '5A', geo: 'UF', ind: 'Anunciado', setor: 'Todos', rec: 'Bruto' };
  return (
    <div className="slide-app" data-theme="light">
      <AppHeader screen={n} theme="light" setTheme={() => {}} />
      <FilterBar values={filters} setValues={() => {}} />
      <ScreenComp />
    </div>
  );
}

function SpecSlide({ Comp }) {
  return <div className="spec-pad"><Comp /></div>;
}

const mounts = [
  ['cover',       Cover],
  ['paleta',      () => <SpecSlide Comp={SpecPaleta} />],
  ['tipografia',  () => <SpecSlide Comp={SpecTipografia} />],
  ['wireframes',  () => <SpecSlide Comp={SpecWireframes} />],
  ['componentes', () => <SpecSlide Comp={SpecComponentes} />],
  ['racional',    () => <SpecSlide Comp={SpecJustificativa} />],
  ['s1',          () => <ScreenSlide n={1} ScreenComp={Screen01_Investimento} />],
  ['s2',          () => <ScreenSlide n={2} ScreenComp={Screen02_Emprego} />],
  ['s3',          () => <ScreenSlide n={3} ScreenComp={Screen03_Setores} />],
  ['s4',          () => <ScreenSlide n={4} ScreenComp={Screen04_Causal} />],
  ['s5',          () => <ScreenSlide n={5} ScreenComp={Screen05_Pipeline} />],
];

mounts.forEach(([id, Comp]) => {
  const el = document.getElementById(id);
  if (el) ReactDOM.createRoot(el).render(<Comp />);
});
</script>
</body>
</html>
